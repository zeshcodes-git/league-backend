# Render's free tier puts the server to sleep after ~15 minutes with no
# traffic, and a sleeping server can't record Kalshi Odds history. This pings
# the lightweight /api/health endpoint (no ESPN call, tiny response) every
# 10 minutes so the odds chart starts the moment each week's matchups are set.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://league-backend-gtvd.onrender.com/api/health
