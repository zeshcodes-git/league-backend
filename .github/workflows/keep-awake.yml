# Render's free tier puts the server to sleep after ~15 minutes with no traffic.
# This job pings the lightweight /api/health endpoint so the server stays awake.
#
# It is PAUSED for now (the schedule is commented out) because the backend is
# running with REFRESH_MODE=off, so there is nothing to keep awake for.
# To turn it back on for game days, set REFRESH_MODE=auto on Render and
# uncomment the schedule below.
name: Keep backend awake

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://league-backend-gtvd.onrender.com/api/health
